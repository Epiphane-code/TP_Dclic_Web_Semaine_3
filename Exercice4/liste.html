<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les listes</title>
</head>

<body>

    <h1>Les listes en HTML</h1>

    <h2>Liste non ordonnée</h2>

    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>Python</li>
    </ul>

    <h2>Liste ordonnée</h2>

    <ol>
        <li>Créer un fichier HTML</li>
        <li>Ajouter la structure HTML</li>
        <li>Ajouter du contenu</li>
        <li>Ouvrir dans le navigateur</li>
    </ol>

</body>
</html>
